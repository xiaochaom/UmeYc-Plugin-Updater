name: Release plugin

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify tag matches package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package
      - name: Verify ZIP and generate checksum
        working-directory: out
        run: |
          unzip -t UmeYc-Plugin-Updater.zip
          sha256sum UmeYc-Plugin-Updater.zip > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-release
          path: |
            out/UmeYc-Plugin-Updater.zip
            out/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-release
          path: out
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/UmeYc-Plugin-Updater.zip out/SHA256SUMS.txt \
            --verify-tag --title "UmeYc-Plugin-Updater $GITHUB_REF_NAME" --notes-from-tag
